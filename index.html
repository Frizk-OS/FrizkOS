<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrizkOS - System Core</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0f12;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        
        #network-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 20px auto 40px auto;
            color: #8b949e;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 20px;
        }

        a.btn {
            text-decoration: none;
            padding: 12px 30px;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            font-size: 1.2rem;
            text-transform: uppercase;
            transition: all 0.2s ease-in-out;
            background: rgba(0, 255, 204, 0.05);
            backdrop-filter: blur(2px);
        }

        a.btn:hover {
            background: #00ffcc;
            color: #0d0f12;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
        }
    </style>
</head>
<body>

    <canvas id="network-canvas"></canvas>

    <div class="content">
        <h1>FrizkOS</h1>
        <p>This is not a default custoom room, this is a big of defaulе custom.</p>
        <div class="buttons">
            <a href="downloads/" class="btn">Downloads</a>
            <a href="wiki/" class="btn">Wiki</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray;
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            init();
        });

        class Particle {
            constructor() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.vx = (Math.random() - 0.5) * 1.5; 
                this.vy = (Math.random() - 0.5) * 1.5;
                this.size = Math.random() * 2 + 1;
            }
            update() {
                if (this.x > w || this.x < 0) this.vx = -this.vx;
                if (this.y > h || this.y < 0) this.vy = -this.vy;
                this.x += this.vx;
                this.y += this.vy;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = '#00ffcc';
                ctx.fill();
            }
        }

        function init() {
            particlesArray = [];
            let numberOfParticles = (w * h) / 9000; 
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, w, h);

            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();

                for (let j = i; j < particlesArray.length; j++) {
                    let dx = particlesArray[i].x - particlesArray[j].x;
                    let dy = particlesArray[i].y - particlesArray[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 120) { 
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 255, 204, ${1 - distance/120})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                        ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        init();
        animate();
    </script>
</body>
</html>
